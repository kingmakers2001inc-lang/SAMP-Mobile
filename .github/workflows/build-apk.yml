name: Build APK

on:
  push:
    paths-ignore: ["server/**", "client-2.10/**", ".github/workflows/build-server.yml", ".github/workflows/build-apk-2.10.yml"]
  pull_request:
    paths-ignore: ["server/**", "client-2.10/**", ".github/workflows/build-server.yml", ".github/workflows/build-apk-2.10.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;26.2.11394342" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      # libGame.so is the GTA SA engine from your own copy of the game. It is
      # not stored in the repo. Set the GAME_LIB_URL repository secret to a
      # private direct-download link and it will be packed into the APK.
      - name: Fetch game engine library
        env:
          GAME_LIB_URL: ${{ secrets.GAME_LIB_URL }}
        run: |
          if [ -n "$GAME_LIB_URL" ]; then
            curl -fL --retry 3 -o app/src/main/jniLibs/arm64-v8a/libGame.so "$GAME_LIB_URL"
            echo "libGame.so added ($(stat -c %s app/src/main/jniLibs/arm64-v8a/libGame.so) bytes)"
            # The client uses fixed memory addresses inside this exact engine build
            expected=4c6a7445e30b27afdda781302e4db9bac89c28fc1181b68b1eef16f84d6a282e
            actual=$(sha256sum app/src/main/jniLibs/arm64-v8a/libGame.so | cut -d' ' -f1)
            if [ "$actual" != "$expected" ]; then
              echo "::warning::libGame.so does not match the engine build this client was made for (sha256 $actual). The game will most likely crash on start."
            fi
          else
            echo "::warning::GAME_LIB_URL secret is not set; the APK is built without libGame.so and will not start until you add it."
          fi

      # Optional built-in server: set the SERVER_HOST / SERVER_PORT repository
      # variables (Settings > Secrets and variables > Actions > Variables).
      - name: Build debug APK
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: samp-mobile-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
